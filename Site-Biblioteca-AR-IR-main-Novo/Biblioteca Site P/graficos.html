<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gráfico Pizza Hover Individual</title>
  <link rel="stylesheet" href="CSS/graficos.css" />
</head>
<body>

<div class="container-laranja">
  <h1>Gráficos dos livros</h1>
  <div class="graficos-conteudo">
    <div>
      <div class="pie-container">
        <div class="slice slice1"></div>
        <div class="slice slice2"></div>
        <div class="slice slice3"></div>
        <span class="pie-label label1">50%</span>
        <span class="pie-label label2">33%</span>
        <span class="pie-label label3">17%</span>
      </div>
      <div class="legend">
        <div><span class="color aaa"></span> Dom Casmurro</div>
        <div><span class="color bbb"></span> A arte da guerra</div>
        <div><span class="color ccc"></span> 1984</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
