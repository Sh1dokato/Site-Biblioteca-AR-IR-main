<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gráfico de Pizza CSS</title>
  <link rel="stylesheet" href="CSS/graficos.css" />
</head>
<body>
<div class="retangulo">
    <h1>Gráficos dos livros</h1>
<main class="main">

            <div class="valor">Dom Casmurro</div>

            <div class="valor">CCC</div>
        </div>
        <div class="barras bar1">
            <span class="texto">27/06 - aaa</span>
        </div>
        <div class="barras bar2">
            <span class="texto">27/06 - aaa</span>
        </div>
        <div class="barras bar3">
            <span class="texto">27/06 - aaa</span>
        </div>
        <div class="barras bar4">
            <span class="texto">27/06 - aaa</span>
        </div>
        <div class="barras bar5">
            <span class="texto">27/06 - aaa</span>
        </div>
    </section>
</main>
    <div class="grafico-container">
        <div class="grafico-pizza"></div>
        <div class="legenda">
          <div class="item-legenda"><div class="cor verde"></div>40% Dom Casmurro</div>
          <div class="item-legenda"><div class="cor azul"></div>30% 1984 </div>
          <div class="item-legenda"><div class="cor roxo"></div>20% A arte da Guerra</div>
          <div class="item-legenda"><div class="cor vermelho"></div>10% A metamorfose</div>
        </div>
      </div>
</div>
